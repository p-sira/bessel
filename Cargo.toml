[package]
name = "bessel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause AND MIT AND BSL-1.0"
description = "Pure Rust cylindrical, spherical, Kelvin, Hankel and Struve functions"
categories = ["mathematics", "science"]
keywords = ["bessel", "hankel", "struve", "kelvin", "spherical"]
readme = "README.md"
include = ["/src/**", "/README.md", "/LICENSE", "/LICENSES/**"]

[dependencies]
num-traits = "0.2"
num-complex = "0.4"
complex-bessel = "0.3"
